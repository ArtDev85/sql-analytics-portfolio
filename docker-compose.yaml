services:
    db:
      container_name: postgresql_db_aca

      image: postgis/postgis:17-3.4
      restart: always
      env_file: .env
      environment:
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: ${DB_NAME}
      ports:
        - "5432:5432"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
        interval: 10s
        timeout: 5s
        retries: 20 #! Increase retries to allow for longer startup times
      volumes:
        # Persist database data (keep your bind mount; a named volume also works)
          - ./postgres_data:/var/lib/postgresql/data
          - ./init:/docker-entrypoint-initdb.d
          - ./data:/data:ro

    pgadmin:
      container_name: pgadmin_aca
      image: dpage/pgadmin4
      restart: always
      env_file: .env
      environment:
        PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
        PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      ports:
        - "5050:80"
      volumes:
        - ./pgadmin_data:/var/lib/pgadmin
        # Mount saved queries folder to pgAdmin storage. Use the storage root so it
        - ./queries:/var/lib/pgadmin/storage/admin_admin.com/queries
      depends_on:
        - db